name: MediIdenta – Render Backend und Supabase API testen

on:
  pull_request:
    paths:
      - 'hosting/**'
      - 'medidenta-preview/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'render.yaml'
      - '.github/workflows/render-hosting-ci.yml'
  push:
    branches: [main]
    paths:
      - 'hosting/**'
      - 'medidenta-preview/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'render.yaml'
      - '.github/workflows/render-hosting-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python-Backend installieren
        run: python -m pip install --disable-pip-version-check -r hosting/requirements.txt
      - name: Syntax und API mit Mock-Supabase prüfen
        run: |
          python -m compileall -q hosting
          python -m unittest discover -s hosting/tests -v
      - name: Änderungen an JS auf Syntax prüfen
        run: |
          node --check medidenta-preview/app.js
          node --check medidenta-preview/review-auth.js
          node --check medidenta-preview/review-ui.js
      - name: Nur öffentliche Zugangsdaten in der Client-Konfiguration
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq 'sb_secret_[A-Za-z0-9_-]{12,}' medidenta-preview/review-auth-config.js; then
            echo 'No Supabase admin secrets in publicly hosted browser code'
            exit 1
          fi

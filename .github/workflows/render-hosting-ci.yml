name: MediIdenta – Render Backend und Supabase API testen

on:
  pull_request:
    paths:
      - 'hosting/**'
      - 'medidenta-preview/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'render.yaml'
      - '.github/workflows/render-hosting-ci.yml'
  push:
    branches: [main]
    paths:
      - 'hosting/**'
      - 'medidenta-preview/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'render.yaml'
      - '.github/workflows/render-hosting-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python-Backend installieren
        run: python -m pip install --disable-pip-version-check -r hosting/requirements.txt
      - name: Syntax und API mit Mock-Supabase prüfen
        run: |
          python -m compileall -q hosting
          python -m unittest discover -s hosting/tests -v
      - name: Änderungen an JS auf Syntax prüfen
        run: |
          node --check medidenta-preview/app.js
          node --check medidenta-preview/review-auth.js
          node --check medidenta-preview/review-ui.js
          node --check medidenta-preview/medication-view.js
          node medidenta-preview/tests/test_medication_view.js
      - name: Echte Docker-Image-Erstellung und HTTP-Smoke-Test
        shell: bash
        run: |
          set -euo pipefail
          docker build -t medidenta-staging-ci:latest .
          CONTAINER_ID="$(docker run -d --rm -p 127.0.0.1:10000:10000 medidenta-staging-ci:latest)"
          trap 'docker logs "$CONTAINER_ID" || true; docker rm -f "$CONTAINER_ID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:10000/api/v1/health >/tmp/medidenta-health.json; then
              break
            fi
            sleep 1
          done
          python -c 'import json; r=json.load(open("/tmp/medidenta-health.json")); assert r["service"]=="MediIdenta" and r["supabase_configured"] is False'
          curl --fail --silent http://127.0.0.1:10000/medidenta-preview/ | grep -q 'MediIdenta'
          echo 'Dockerized MediIdenta API and PWA startup: OK.'

      - name: Nur öffentliche Zugangsdaten in der Client-Konfiguration
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq 'sb_secret_[A-Za-z0-9_-]{12,}' medidenta-preview/review-auth-config.js; then
            echo 'No Supabase admin secrets in publicly hosted browser code'
            exit 1
          fi
